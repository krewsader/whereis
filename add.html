<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Location</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        input {
            width: 300px;
            padding: 10px 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            width: 300px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-link {
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add new Location</h1>

        <form action="/added" method="POST">
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Department name"
                required
            >

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Location"
                required
            >

            <input
                type="text"
                id="room"
                name="room"
                placeholder="Example room"
            >

            <input
                type="text"
                id="password"
                name="password"
                placeholder="Password"
                required
            >


            <button type="submit">Add room</button>
        </form>

        <a href="/" class="back-link">Back to search</a>
    </div>
</body>
</html>
